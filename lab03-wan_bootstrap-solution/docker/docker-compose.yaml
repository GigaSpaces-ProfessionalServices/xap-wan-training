# WAN Gateway bootstrap topology, containerized: 6 containers, 2 sites (US,
# EMEA), one flat network -- same active-active shape as lab02-active_active,
# but US's gateway sink deploys with requires-bootstrap=true, so it needs an
# explicit AdminBootstrapInitiator call to pull in EMEA's pre-existing data.
# US-side services are profile-gated ("us") rather than starting by default,
# since the lab's whole point is the staged, operator-driven boot order.
# See ../README.md to build and run this (order matters here), and
# build-notes.md for why it's built this way.
#
# IMPORTANT: always re-run `mvn install` immediately before `docker compose
# up` if target/ might have been cleaned -- Docker silently auto-creates a
# missing bind-mount source as an empty root-owned directory rather than
# erroring, which gs.sh will happily zip into a valid-but-empty deploy
# artifact. The deploy scripts also fail loudly with an explicit check for
# this (see deploy-us.sh/deploy-emea.sh).

name: wan-bootstrap

x-gs-image: &gs-image gigaspaces/smart-cache-enterprise:${GS_VERSION:-17.3.0}

services:

  # -------------------------------------------------------------- EMEA site --
  # No profile: comes up by default with a plain `docker compose up -d`, since
  # EMEA must be fed *before* US is ever started in this lab.
  emea-manager:
    image: *gs-image
    hostname: emea-manager
    command: host run-agent --manager --restv3
    environment:
      GS_MANAGER_SERVERS: emea-manager
      GS_LICENSE: "tryme"
      GS_NIC_ADDRESS: "#local:ip#"
      GS_OPTIONS_EXT: "-Dcom.gs.multicast.enabled=false"
    networks:
      wan-net:
        ipv4_address: 172.28.2.10
    ports:
      - "29090:9090"   # REST V3 API / Swagger UI

  emea-space-gsc:
    image: *gs-image
    hostname: emea-space-gsc
    command: host run-agent --gsc=4
    environment:
      GS_MANAGER_SERVERS: emea-manager
      GS_LICENSE: "tryme"
      GS_NIC_ADDRESS: "#local:ip#"
      GS_OPTIONS_EXT: "-Dcom.gs.zones=EMEA-space -Dcom.gs.multicast.enabled=false"
    networks:
      wan-net:
        ipv4_address: 172.28.2.21
    depends_on:
      - emea-manager

  emea-gateway-gsc:
    image: *gs-image
    hostname: emea-gateway-gsc
    command: host run-agent --gsc=1
    environment:
      GS_MANAGER_SERVERS: emea-manager
      GS_LICENSE: "tryme"
      GS_NIC_ADDRESS: "#local:ip#"
      # Pins the embedded-LUS discovery port (matches BillBuddyGateway/pu.xml's
      # localLookupPort=4174) and the LRMI bind-port (8201, matches
      # localCommunicationPort=8201) explicitly on the GSC child JVM only.
      GS_GSC_OPTIONS: "-Dcom.gs.zones=EMEA-gateway -Dcom.sun.jini.reggie.initialUnicastDiscoveryPort=4174 -Dcom.gs.transport_protocol.lrmi.bind-port=8201"
      GS_OPTIONS_EXT: "-Dcom.gs.multicast.enabled=false"
    networks:
      wan-net:
        ipv4_address: 172.28.2.30
    depends_on:
      - emea-manager

  emea-deployer:
    image: *gs-image
    entrypoint: /bin/bash
    command: ["/scripts/deploy-emea.sh"]
    volumes:
      - ./deploy-emea.sh:/scripts/deploy-emea.sh:ro
      - ../BillBuddySpace/target/BillBuddySpace.jar:/deploy/BillBuddySpace.jar:ro
      - ../BillBuddyGateway/target/BillBuddyGateway.jar:/deploy/BillBuddyGateway.jar:ro
    networks:
      - wan-net
    depends_on:
      - emea-manager
      - emea-space-gsc
      - emea-gateway-gsc

  emea-feeder:
    build:
      context: ../BillBuddyAccountFeeder
    environment:
      GS_LOCATORS: emea-manager
      SPACE_NAME: wanSpaceEMEA
    networks:
      - wan-net
    depends_on:
      - emea-deployer
    profiles: ["feeder"]

  # ---------------------------------------------------------------- US site --
  # profiles: ["us"] on every US service -- these do NOT start with a plain
  # `docker compose up -d`. Bring them up explicitly, after EMEA has been fed,
  # with `docker compose --profile us up -d`.
  us-manager:
    image: *gs-image
    hostname: us-manager
    command: host run-agent --manager --restv3
    environment:
      GS_MANAGER_SERVERS: us-manager
      GS_LICENSE: "tryme"
      GS_NIC_ADDRESS: "#local:ip#"
      GS_OPTIONS_EXT: "-Dcom.gs.multicast.enabled=false"
    networks:
      wan-net:
        ipv4_address: 172.28.1.10
    ports:
      - "19090:9090"   # REST V3 API / Swagger UI
    profiles: ["us"]

  us-space-gsc:
    image: *gs-image
    hostname: us-space-gsc
    command: host run-agent --gsc=4
    environment:
      GS_MANAGER_SERVERS: us-manager
      GS_LICENSE: "tryme"
      GS_NIC_ADDRESS: "#local:ip#"
      GS_OPTIONS_EXT: "-Dcom.gs.zones=US-space -Dcom.gs.multicast.enabled=false"
    networks:
      wan-net:
        ipv4_address: 172.28.1.21
    depends_on:
      - us-manager
    profiles: ["us"]

  us-gateway-gsc:
    image: *gs-image
    hostname: us-gateway-gsc
    command: host run-agent --gsc=1
    environment:
      GS_MANAGER_SERVERS: us-manager
      GS_LICENSE: "tryme"
      GS_NIC_ADDRESS: "#local:ip#"
      GS_GSC_OPTIONS: "-Dcom.gs.zones=US-gateway -Dcom.sun.jini.reggie.initialUnicastDiscoveryPort=4174 -Dcom.gs.transport_protocol.lrmi.bind-port=8201"
      GS_OPTIONS_EXT: "-Dcom.gs.multicast.enabled=false"
    networks:
      wan-net:
        ipv4_address: 172.28.1.30
    depends_on:
      - us-manager
    profiles: ["us"]

  us-deployer:
    image: *gs-image
    entrypoint: /bin/bash
    command: ["/scripts/deploy-us.sh"]
    volumes:
      - ./deploy-us.sh:/scripts/deploy-us.sh:ro
      - ../BillBuddySpace/target/BillBuddySpace.jar:/deploy/BillBuddySpace.jar:ro
      - ../BillBuddyGateway/target/BillBuddyGateway.jar:/deploy/BillBuddyGateway.jar:ro
    networks:
      - wan-net
    depends_on:
      - us-manager
      - us-space-gsc
      - us-gateway-gsc
    profiles: ["us"]

  us-feeder:
    build:
      context: ../BillBuddyAccountFeeder
    environment:
      GS_LOCATORS: us-manager
      SPACE_NAME: wanSpaceUS
    networks:
      - wan-net
    # No depends_on: us-deployer is profile-gated behind "us", and a service's
    # depends_on target must exist under whatever profile set is active on THIS
    # invocation -- `--profile feeder run us-feeder` alone would otherwise fail
    # compose validation even when us-deployer is already up from an earlier
    # `--profile us` invocation. Run this only after the documented step order.
    profiles: ["feeder"]

  # ---------------------------------------------------------- bootstrapping --
  # One-shot: runs AdminBootstrapInitiator, which waits for the US gateway's
  # sink to see EMEA and then calls bootstrapFromGatewayAndWait(), pulling
  # EMEA's existing data into US. Run only after both sites are up (step 4)
  # and before relying on US having any data.
  bootstrap-initiator:
    build:
      context: ../AdminBootStrap
    environment:
      GS_LOCATORS: us-manager
    networks:
      - wan-net
    # No depends_on: us-deployer is profile-gated behind "us" -- see the same
    # comment on us-feeder. AdminBootstrapInitiator itself waits internally
    # (admin.getGateways().waitFor("US")) so it's safe to start before US's
    # deploy has fully finished.
    profiles: ["bootstrap"]

networks:
  wan-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
