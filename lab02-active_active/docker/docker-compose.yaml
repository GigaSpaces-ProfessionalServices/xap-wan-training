# WAN Gateway active-active topology, containerized: 6 containers, 2 sites
# (US and EMEA, both peers), one flat network. See ../README.md to build and
# run this, and build-notes.md for why it's built this way (network, module
# split, packaging).
#
# IMPORTANT: always re-run `mvn install` immediately before `docker compose
# up` if target/ might have been cleaned -- Docker silently auto-creates a
# missing bind-mount source as an empty root-owned directory rather than
# erroring, which gs.sh will happily zip into a valid-but-empty deploy
# artifact. The deploy scripts also fail loudly with an explicit check for
# this (see deploy-us.sh/deploy-emea.sh).

x-gs-image: &gs-image gigaspaces/smart-cache-enterprise:${GS_VERSION:-17.3.0}

services:

  # ---------------------------------------------------------------- US site --
  us-manager:
    image: *gs-image
    hostname: us-manager
    # --restv3 enables the modern REST Manager API on port 9090 (path
    # /api/v3/...), alongside the older, deprecated v2 API on 8090 -- both
    # stay active together, this doesn't replace v2. gs.sh CLI calls (used
    # by deploy-us.sh/deploy-emea.sh) are unaffected either way; only the
    # readiness-check curl and the published host port target v3/9090.
    command: host run-agent --manager --restv3 --webui
    environment:
      GS_MANAGER_SERVERS: us-manager
      GS_LICENSE: "tryme"
      GS_NIC_ADDRESS: "#local:ip#"
      # Disabled since both sites share one flat network -- multicast discovery
      # doesn't respect the US/EMEA distinction and was letting GSCs discover
      # (and sometimes get instructed by) the other site's manager. Every
      # component already has an explicit GS_MANAGER_SERVERS/locator, so
      # unicast-only discovery is sufficient.
      GS_OPTIONS_EXT: "-Dcom.gs.multicast.enabled=false"
    networks:
      wan-net:
        ipv4_address: 172.28.1.10
    ports:
      - "19090:9090"   # REST V3 API / Swagger UI

  us-space-gsc:
    image: *gs-image
    hostname: us-space-gsc
    command: host run-agent --gsc=4
    environment:
      GS_MANAGER_SERVERS: us-manager
      GS_LICENSE: "tryme"
      GS_NIC_ADDRESS: "#local:ip#"
      GS_OPTIONS_EXT: "-Dcom.gs.zones=US-space -Dcom.gs.multicast.enabled=false"
    networks:
      wan-net:
        ipv4_address: 172.28.1.21
    depends_on:
      - us-manager

  us-gateway-gsc:
    image: *gs-image
    hostname: us-gateway-gsc
    command: host run-agent --gsc=1
    environment:
      GS_MANAGER_SERVERS: us-manager
      GS_LICENSE: "tryme"
      # Single network now, so "#local:ip#" is unambiguous again -- no more need
      # to hardcode an address (that was only necessary for the dual-homed case).
      GS_NIC_ADDRESS: "#local:ip#"
      # GS_GSC_OPTIONS (scoped to only the GSC child JVM, not the GSA) pins the
      # embedded-LUS discovery port (matches BillBuddyGateway/pu.xml's
      # localLookupPort=4174) -- without it, start-embedded-lus never actually binds
      # a discovery listener ("Discovery port: 0"), so the gateway component keeps
      # trying to relocate itself and the PU stays at 0 instances.
      # Also explicitly pins com.gs.transport_protocol.lrmi.bind-port=8201 to match
      # localCommunicationPort=8201 in the pu.xml/deploy properties, rather than
      # relying on it landing there implicitly (GSA takes 8200 first, the sole GSC
      # takes 8201 next, deterministically, in this dedicated 1-GSA+1-GSC container).
      GS_GSC_OPTIONS: "-Dcom.gs.zones=US-gateway -Dcom.sun.jini.reggie.initialUnicastDiscoveryPort=4174 -Dcom.gs.transport_protocol.lrmi.bind-port=8201"
      # GS_OPTIONS_EXT (both GSA and GSC) -- see the comment on us-manager for why.
      GS_OPTIONS_EXT: "-Dcom.gs.multicast.enabled=false"
    networks:
      wan-net:
        ipv4_address: 172.28.1.30
    depends_on:
      - us-manager

  us-deployer:
    image: *gs-image
    entrypoint: /bin/bash
    command: ["/scripts/deploy-us.sh"]
    volumes:
      - ./deploy-us.sh:/scripts/deploy-us.sh:ro
      - ../BillBuddySpace/target/BillBuddySpace.jar:/deploy/BillBuddySpace.jar:ro
      - ../BillBuddyGateway/target/BillBuddyGateway.jar:/deploy/BillBuddyGateway.jar:ro
    networks:
      - wan-net
    depends_on:
      - us-manager
      - us-space-gsc
      - us-gateway-gsc

  us-feeder:
    build:
      context: ../BillBuddyAccountFeeder
    environment:
      LOCATORS: us-manager
      SPACE_NAME: wanSpaceUS
    networks:
      - wan-net
    depends_on:
      - us-deployer
    profiles: ["feeder"]

  # -------------------------------------------------------------- EMEA site --
  emea-manager:
    image: *gs-image
    hostname: emea-manager
    # See the matching comment on us-manager.
    command: host run-agent --manager --restv3 --webui
    environment:
      GS_MANAGER_SERVERS: emea-manager
      GS_LICENSE: "tryme"
      GS_NIC_ADDRESS: "#local:ip#"
      # See the matching comment on us-manager.
      GS_OPTIONS_EXT: "-Dcom.gs.multicast.enabled=false"
    networks:
      wan-net:
        ipv4_address: 172.28.2.10
    ports:
      - "29090:9090"   # REST V3 API / Swagger UI

  emea-space-gsc:
    image: *gs-image
    hostname: emea-space-gsc
    command: host run-agent --gsc=4
    environment:
      GS_MANAGER_SERVERS: emea-manager
      GS_LICENSE: "tryme"
      GS_NIC_ADDRESS: "#local:ip#"
      GS_OPTIONS_EXT: "-Dcom.gs.zones=EMEA-space -Dcom.gs.multicast.enabled=false"
    networks:
      wan-net:
        ipv4_address: 172.28.2.21
    depends_on:
      - emea-manager

  emea-gateway-gsc:
    image: *gs-image
    hostname: emea-gateway-gsc
    command: host run-agent --gsc=1
    environment:
      GS_MANAGER_SERVERS: emea-manager
      GS_LICENSE: "tryme"
      # See the matching comment on us-gateway-gsc: single network now, "#local:ip#"
      # is unambiguous.
      GS_NIC_ADDRESS: "#local:ip#"
      # See the matching comment on us-gateway-gsc: pins both the discovery port and
      # the LRMI bind-port (8201, GSC-scoped) explicitly, matching
      # BillBuddyGateway/pu.xml's localCommunicationPort=8201.
      GS_GSC_OPTIONS: "-Dcom.gs.zones=EMEA-gateway -Dcom.sun.jini.reggie.initialUnicastDiscoveryPort=4174 -Dcom.gs.transport_protocol.lrmi.bind-port=8201"
      # See the matching comment on us-gateway-gsc.
      GS_OPTIONS_EXT: "-Dcom.gs.multicast.enabled=false"
    networks:
      wan-net:
        ipv4_address: 172.28.2.30
    depends_on:
      - emea-manager

  emea-deployer:
    image: *gs-image
    entrypoint: /bin/bash
    command: ["/scripts/deploy-emea.sh"]
    volumes:
      - ./deploy-emea.sh:/scripts/deploy-emea.sh:ro
      - ../BillBuddySpace/target/BillBuddySpace.jar:/deploy/BillBuddySpace.jar:ro
      - ../BillBuddyGateway/target/BillBuddyGateway.jar:/deploy/BillBuddyGateway.jar:ro
    networks:
      - wan-net
    depends_on:
      - emea-manager
      - emea-space-gsc
      - emea-gateway-gsc

  emea-feeder:
    build:
      context: ../BillBuddyAccountFeeder
    environment:
      LOCATORS: emea-manager
      SPACE_NAME: wanSpaceEMEA
    networks:
      - wan-net
    depends_on:
      - emea-deployer
    profiles: ["feeder"]

networks:
  wan-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
